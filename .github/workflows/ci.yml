# Builds BeBox and runs the core's tests on Windows, Linux, macOS and
# Haiku: the applications (Win32, Qt, native Haiku), bebox-headless,
# bebox-img and the device, Hobbit, QCOW2 and BFS tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p zlib:p libslirp:p
            qt6-base:p qt6-multimedia:p SDL2:p
      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: |
          mkdir -p ci-work/qcow2 ci-work/bfs
          build/device-tests
          build/hobbit-tests
          build/qcow2-tests ci-work/qcow2
          build/bfs-tests ci-work/bfs
          test -f build/src/win32/BeBox.exe
          test -f build/src/qt/BeBoxQt.exe

  linux:
    name: Linux (Ubuntu 26.04)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ pkg-config \
            zlib1g-dev libslirp-dev \
            qt6-base-dev qt6-multimedia-dev libsdl2-dev
      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: |
          mkdir -p ci-work/qcow2 ci-work/bfs
          build/device-tests
          build/hobbit-tests
          build/qcow2-tests ci-work/qcow2
          build/bfs-tests ci-work/bfs
          test -x build/src/qt/BeBox

  macos:
    name: macOS (Homebrew)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: brew install ninja pkg-config libslirp qt sdl2
      - name: Configure
        run: >-
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Build
        # all the errors in one run, not only the first
        run: cmake --build build -- -k 0
      - name: Test
        run: |
          mkdir -p ci-work/qcow2 ci-work/bfs
          build/device-tests
          build/hobbit-tests
          build/qcow2-tests ci-work/qcow2
          build/bfs-tests ci-work/bfs
          test -d build/src/qt/BeBox.app

  haiku:
    name: Haiku (R1/beta6 x86_64)
    runs-on: ubuntu-latest
    # a hang in the VM must not run for hours
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Start Haiku
        uses: cross-platform-actions/action@v1.7.0
        with:
          operating_system: haiku
          architecture: x86-64
          version: 'r1beta6'
          shell: bash
      - name: Install packages
        shell: cpa.sh {0}
        run: >-
          pkgman install -y haiku_devel zlib_devel libslirp_devel cmake ninja
          qt6_base_devel qt6_multimedia_devel libsdl2_devel
      - name: Build the native application
        shell: cpa.sh {0}
        run: make -j4
      - name: Build the Qt application, the tools and the tests
        shell: cpa.sh {0}
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        shell: cpa.sh {0}
        run: |
          mkdir -p ci-work/qcow2 ci-work/bfs
          build/device-tests
          build/hobbit-tests
          build/qcow2-tests ci-work/qcow2
          build/bfs-tests ci-work/bfs
          test -x objects.*/BeBox
          test -x build/src/qt/BeBox
